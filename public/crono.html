<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CronoFutbol · Gestor de torneos</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<style>*,::before,::after{box-sizing:border-box}a{color:inherit;text-decoration:none}h2,h3,p{margin:0}button,input,select{font:inherit}

:root{--bg:#050D1F;--g1:#138A3B;--g2:#0E6B2D;--line:#ffffff2e}
body{margin:0;min-height:100vh;color:#E6ECF5;font-family:'Barlow Semi Condensed',Arial,sans-serif;font-weight:500;letter-spacing:.2px;
  background:radial-gradient(ellipse at 20% -10%,#0F2E5C55,transparent 55%),var(--bg)}
button{cursor:pointer;font:inherit}
.banner{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(180deg,#16A046,#0E6B2D);border-bottom:1px solid #ffffff66;box-shadow:0 4px 16px #0009}
#burger{background:#ffffff1f;color:#fff;border:1px solid #ffffff55;border-radius:8px;width:38px;height:38px;font-size:18px}
#burger:hover{background:#ffffff33}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo-t{font-size:1.55rem;font-weight:800;letter-spacing:.3px}
.logo-t b{color:#BFF3D1;font-weight:600}
#user{position:relative;display:flex;gap:8px;margin-left:auto}
.ubtn,.btn{background:#fff;color:#0E6B2D;border:0;border-radius:8px;padding:8px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.btn{background:var(--g1);color:#fff;border:1px solid #ffffff66}.btn.alt{background:transparent}
.btn:hover{filter:brightness(1.12)}
.av{width:24px;height:24px;border-radius:50%;background:#0E6B2D;color:#fff;display:grid;place-items:center;font-size:.8rem}
.um{position:absolute;right:0;top:52px;width:240px;background:#091A38;border:1px solid #ffffffaa;border-radius:10px;padding:10px;display:grid;gap:6px;box-shadow:0 14px 30px #000b}
.um button,.um select{background:#102850;color:#fff;border:0;border-radius:6px;padding:8px;text-align:left;width:100%}
.um button:hover{background:#17376b}.um label{font-size:.8rem;display:grid;gap:4px;opacity:.9}.hide{display:none!important}
.shell{display:flex;min-height:calc(100vh - 64px)}
#side{width:250px;flex:none;background:#030913;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;transition:width .2s;overflow:hidden;position:sticky;top:64px;height:calc(100vh - 64px)}
#sn{display:flex;flex-direction:column;gap:2px}#sn>*{flex:none}
#sn button{display:flex;gap:12px;align-items:center;background:transparent;color:#C9D4E6;border:0;border-left:3px solid transparent;border-radius:6px;padding:10px;text-align:left;white-space:nowrap}
#sn button:hover{background:#0B1B3A;color:#fff}#sn button.on{background:#0B1B3A;color:#fff;border-left-color:#22c55e}
.ic{flex:none}
#ct{margin-top:auto;display:grid;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
#ct a{display:flex;align-items:center;gap:10px;color:#C9D4E6;text-decoration:none;font-size:.9rem;white-space:nowrap;padding:4px 6px;border-radius:6px}
#ct a:hover{background:#0B1B3A;color:#fff}.ci{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;border:1px solid #ffffff55}
body.mini #side{width:62px}body.mini #sn button span,body.mini #ct a span{display:none}
main{flex:1;min-width:0;padding:22px 26px}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{background:transparent;color:#C9D4E6;border:1px solid var(--line);border-radius:6px;padding:7px 14px;font-weight:600}
.tab:hover{border-color:#fff;color:#fff}.tab.on{background:var(--g1);border-color:#fff;color:#fff}
#title{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:700;margin:0 0 16px;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{container-type:inline-size;background:linear-gradient(165deg,#0C1F42,#06122A);border:2px solid #ffffffd9;border-radius:10px;padding:16px;
  box-shadow:0 4px 0 #ffffff26,0 14px 28px #000a,inset 0 1px 0 #ffffff1f;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 7px 0 #ffffff30,0 18px 30px #000b,inset 0 1px 0 #ffffff1f}
.card h3{margin:0 0 10px;font-size:clamp(1rem,5.5cqw,1.35rem);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card p{margin:5px 0;font-size:clamp(.88rem,4cqw,1rem);color:#CBD5E6}.mut{opacity:.65}
.bd{display:inline-block;background:#1E3560;color:#fff;border-radius:4px;padding:2px 8px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.bd.en_curso{background:#B91C1C}.bd.programado{background:#1D4ED8}.bd.finalizado{background:var(--g2)}.bd.cancelado{background:#475569}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.vs b{flex:1;font-size:clamp(.9rem,4.8cqw,1.15rem);font-weight:600}
.sc{background:#030913;color:#fff;border:1px solid #ffffff55;font-weight:700;border-radius:6px;padding:2px 10px;font-size:clamp(1rem,6cqw,1.4rem);font-variant-numeric:tabular-nums}
.inp{display:block;width:100%;background:#091A38;color:#fff;border:1px solid #ffffff88;border-radius:8px;padding:10px;margin:0 0 12px}
.inp:focus{outline:2px solid #22c55e;border-color:transparent}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;opacity:.7}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid #ffffff1f}
.bar{height:6px;background:#ffffff1f;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#22c55e}
.empty{text-align:center;opacity:.7;padding:34px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
dialog{background:#091A38;color:#fff;border:2px solid #ffffffd9;border-radius:12px;padding:24px;width:min(92vw,380px)}
dialog::backdrop{background:#000b}#fa{display:grid;gap:4px}#fa a{color:#BFF3D1;text-align:center;margin-top:8px;font-size:.9rem}.er{color:#fca5a5;margin:0;font-size:.9rem}
#fa .btn,.auth .btn{width:100%;justify-content:center;margin-top:6px}.fl{display:grid;gap:4px;font-size:.8rem;opacity:.95;text-transform:uppercase;letter-spacing:.6px}.fl .inp{margin:0;text-transform:none;letter-spacing:0;font-size:1rem}.ft{font-size:1.3rem;font-weight:700;margin-bottom:6px}
dialog{max-height:90vh;overflow:auto}
.sec{font-size:1.25rem;font-weight:700;margin:26px 0 12px}.acts{display:flex;gap:8px;margin-top:12px!important}
.sm{background:transparent;color:#fff;border:1px solid #ffffff88;border-radius:6px;padding:4px 12px;font-size:.85rem}.sm:hover{background:#ffffff1f}.sm.dg{border-color:#f87171;color:#fca5a5}.sm.dg:hover{background:#7f1d1d55}
.auth{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;max-width:920px;margin:20px auto}.ap h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;line-height:1.1;margin-bottom:12px}.ap p{opacity:.8;margin-bottom:14px}.ap li{margin:8px 0 8px 18px;list-style:square;color:#BFF3D1}
.auth form{display:grid;gap:4px}.auth .card h3{margin-bottom:14px}
@media(max-width:800px){.auth{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0 14px}.kv dt{opacity:.6;font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;padding-top:3px}.kv dd{margin:0}
#dd{background:#091A38;color:#fff;border:2px solid #ffffffd9;border-radius:12px;padding:24px;width:min(94vw,640px);max-height:90vh;overflow:auto}#dd::backdrop{background:#000b}
#dd h3{font-size:1.5rem;font-weight:800;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#dd h4{margin:18px 0 8px;font-size:1.05rem;border-bottom:1px solid var(--line);padding-bottom:4px}.grid1{display:grid;gap:14px}
.card[data-v]{cursor:pointer}.more{opacity:.55;font-size:.8rem!important;margin-top:10px!important}.ck{cursor:pointer}.ck:hover{background:#ffffff0d}

.qa{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px}.qa .btn{width:auto}
.rb{background:#00000040;border-radius:4px;padding:1px 7px;font-size:.7rem;text-transform:uppercase;letter-spacing:.7px;margin-left:2px}
.rolchip{margin:0 4px 10px;padding:7px 10px;border-left:3px solid #22c55e;background:#0B1B3A;border-radius:0 6px 6px 0;font-size:.75rem;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.rolchip[data-r=admin]{border-color:#60a5fa}.rolchip[data-r=dt]{border-color:#22c55e}.rolchip[data-r=jug]{border-color:#c084fc}.rolchip[data-r=arb]{border-color:#fbbf24}.rolchip[data-r=afi]{border-color:#94a3b8}
body.mini .rolchip{display:none}
.rp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.rc{position:relative;border:1px solid #ffffff55;border-radius:8px;padding:8px 10px;cursor:pointer;display:grid;gap:2px}
.rc input{position:absolute;opacity:0}.rc:has(input:checked){border-color:#22c55e;background:#0E6B2D55}.rc span{font-size:.72rem;opacity:.7}
.sel{background:#102850;color:#fff;border:1px solid #ffffff55;border-radius:6px;padding:5px 8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#091A38;border:1px solid #ffffffaa;color:#fff;border-radius:8px;padding:10px 18px;z-index:99}
@media(max-width:800px){#side{position:fixed;z-index:40;left:0;top:64px;transform:translateX(-100%);width:250px!important}body.open #side{transform:none}.logo-t{display:none}main{padding:16px}}

.pill{display:inline-block;background:#22c55e22;color:#BFF3D1;border:1px solid #22c55e66;border-radius:99px;padding:4px 12px;font-size:.78rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#030913;border:1px solid #ffffff44;border-radius:10px;padding:4px;margin-bottom:18px;gap:4px}
.seg a{text-align:center;padding:9px;border-radius:7px;font-weight:700;color:#C9D4E6}.seg a.on{background:var(--g1);color:#fff;box-shadow:0 2px 8px #0008}.seg a:not(.on):hover{background:#0B1B3A}
.pw{position:relative}.pw .inp{padding-right:44px}.eye{position:absolute;right:6px;top:4px;background:transparent;border:0;color:#fff;font-size:1.05rem;width:34px;height:34px;opacity:.7}.eye:hover{opacity:1}
.btn:disabled{opacity:.65;cursor:wait}
.auth{animation:fi .35s ease}.auth .card{padding:26px;box-shadow:0 20px 50px #000c,inset 0 1px 0 #ffffff1f}.auth .card:hover{transform:none}
.ap h2{background:linear-gradient(90deg,#fff,#BFF3D1);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view{animation:fi .3s ease}
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:34px 36px;margin-bottom:26px;border-radius:16px;border:1px solid #ffffff55;overflow:hidden;position:relative;
  background:radial-gradient(circle at 85% 20%,#22c55e44,transparent 55%),linear-gradient(135deg,#0E6B2D,#06122A 70%);box-shadow:0 18px 40px #000a}
.hero h2{font-size:clamp(1.8rem,4.5vw,3rem);font-weight:800;line-height:1.05;margin-bottom:12px}.hero p{opacity:.85;max-width:520px;font-size:1.1rem}
.hball{font-size:clamp(4rem,12vw,8rem);filter:drop-shadow(0 10px 20px #000a);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(8deg)}}
.wel{display:flex;align-items:center;gap:16px;padding:20px 24px;margin-bottom:22px;border-radius:14px;border:1px solid #ffffff55;background:linear-gradient(135deg,#0E6B2D,#0C1F42);box-shadow:0 12px 30px #0009}
.wel .av{width:52px;height:52px;font-size:1.4rem;background:#fff;color:#0E6B2D;font-weight:800}.wel h3{font-size:1.5rem;font-weight:800}.wel p{opacity:.85;margin-top:2px}
.mc{display:flex;align-items:center;gap:14px;cursor:pointer}.mc h3{margin:0 0 2px}.mc p{margin:0}.mc>div{flex:1}
.mi{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;background:#22c55e22;border:1px solid #22c55e66;flex:none}
.ar{font-size:1.6rem;opacity:.5;transition:.15s}.mc:hover .ar{opacity:1;transform:translateX(4px)}.mc:hover .mi{background:#22c55e44}
.ft2{margin-top:40px;padding:20px 0 8px;border-top:1px solid var(--line);text-align:center;opacity:.6;font-size:.85rem}
.tab{transition:.15s}
.sbrand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;margin-bottom:8px;border-bottom:1px solid var(--line);color:#fff;white-space:nowrap}
.sbrand svg{flex:none;filter:drop-shadow(0 4px 8px #0008)}.sbrand b{display:block;font-size:1.3rem;font-weight:800;line-height:1}.sbrand i{font-style:normal;color:#BFF3D1;font-weight:600}
.sbrand small{display:block;opacity:.6;font-size:.68rem;letter-spacing:1.2px;text-transform:uppercase;margin-top:4px}
body.mini .sbrand{justify-content:center;padding-left:0;padding-right:0}body.mini .sbrand div{display:none}
#sn{min-height:0;overflow-y:auto;overflow-x:hidden}
.sh{margin:14px 10px 4px;font-size:.68rem;letter-spacing:1.2px;text-transform:uppercase;opacity:.5;white-space:nowrap}body.mini .sh{display:none}
#sn button[data-out]{color:#fca5a5}#sn button[data-out]:hover{background:#7f1d1d55;color:#fff}
.ra{margin:6px 4px 4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#0B1B3A66;cursor:pointer}.ra:hover{background:#0B1B3A}.ra .sh{margin:0 0 6px}
.rar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;padding:3px 0;color:#C9D4E6;white-space:nowrap}.rar b{background:#ffffff1f;border-radius:99px;padding:0 8px;font-size:.75rem}
.rar.top{color:#fff;font-weight:700}.rar.top b{background:#60a5fa;color:#031024}body.mini .ra{display:none}
</style></head>

      + (res.length ? `<h3 class=sec style="margin-top:0">Roles activos</h3><div class=grid>${res.join('')}</div><h3 class=sec>Usuarios</h3>` : '')
      + `<div class=card><div class=tw><table><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Estado</th></tr>${us.map((u) => `<tr><td>${esc(u.nombre)} ${esc(u.apellido)}</td><td>${esc(u.email)}</td><td><select class=sel data-ur=${u.id}>${ops(u).map((r) => `<option value=${r.id} ${u.rol_id == r.id ? 'selected' : ''}>${esc(r.nombre)}</option>`).join('')}</select></td><td>${bd(u.estado)}</td></tr>`).join('')}</table></div></div>`;
  },
  mi: () => {
    if (rk() === 'dt') {
      const e = miEq(); if (!e) return homeRole('dt');
      const js = d('jugadores').filter((j) => j.equipo_id == e.id);
      return `<article class=card><h3>${esc(e.nombre)} ${bd(e.estado)}</h3>${kv([['Entrenador', esc(e.entrenador)], ['Teléfono', esc(e.telefono)], ['Correo', esc(e.correo)]])}${adm('equipos', e.id)}</article><h3 class=sec>Plantilla (${js.length})</h3>${nuevo('jugadores', 'Agregar jugador')}` + grid(js.map(jc));
    }
    const j = miJug(); if (!j) return homeRole('jug');
    const t = totJ(j.id);
    return `<article class=card><h3>${esc(j.nombre)} ${esc(j.apellido)} ${bd(j.estado)}</h3>${kv([['Equipo', esc(eqN(j.equipo_id))], ['Posición', esc(j.posicion)], ['Dorsal', esc(j.numero_camiseta)], ['Documento', esc(j.documento)], ['Nacimiento', day(j.fecha_nacimiento)]])}<h4 class=sec>Mis estadísticas</h4>${kv([['Partidos con registro', t.p], ['Goles', t.g], ['Asistencias', t.a], ['Tarjetas amarillas', t.y], ['Tarjetas rojas', t.r], ['Minutos', t.m]])}${adm('jugadores', j.id)}</article>`;
  },
  jugadores: () => nuevo('jugadores', 'Nuevo jugador') + `<input id=q class=inp placeholder=" Buscar jugador, equipo o posición…" value="${esc(S.q)}"><div id=gj>${jCards()}</div>`,
  stats: () => {
    const m = {};
    d('estadisticas-jugadores').forEach((s) => { const a = (m[s.jugador_id] ??= { g: 0, a: 0, y: 0, r: 0, m: 0, p: 0 }); a.g += +s.goles; a.a += +s.asistencias; a.y += +s.tarjetas_amarillas; a.r += +s.tarjetas_rojas; a.m += +s.minutos_jugados; a.p++; });
    const rows = Object.entries(m).sort((x, y) => y[1].g - x[1].g), max = Math.max(1, ...rows.map((r) => r[1].g));
    return nuevo('estadisticas-jugadores', 'Registrar estadística') + (rows.length
      ? `<div class=card><div class=tw><table><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>PJ</th><th>G</th><th>A</th><th>TA</th><th>TR</th><th>Min</th><th></th></tr>${rows.map(([id, a], i) => `<tr data-v="jugadores:${id}" class=ck><td>${i + 1}</td><td>${esc(jugN(id))}</td><td>${esc(eqN((d('jugadores').find((j) => j.id == id) || {}).equipo_id))}</td><td>${a.p}</td><td>${a.g}</td><td>${a.a}</td><td>${a.y}</td><td>${a.r}</td><td>${a.m}'</td><td style="min-width:90px"><div class=bar><i style="width:${(a.g / max) * 100}%"></i></div></td></tr>`).join('')}</table></div></div><p class=mut style="margin-top:12px">PJ partidos con registro · G goles · A asistencias · TA tarjetas amarillas · TR tarjetas rojas · Min minutos. Haz clic en un jugador para ver su detalle.</p>`
      : `<p class=empty>Aún no hay estadísticas registradas. ${S.user ? 'Usa "Registrar estadística".' : 'Inicia sesión para registrarlas.'}</p>`);
  },
  activos: () => `<p><button class="btn ${S.act ? '' : 'alt'}" data-a=1> Activos</button> <button class="btn ${S.act ? 'alt' : ''}" data-a=0> Inactivos</button></p><br>`
    + grid(d('torneos').filter((t) => (['en_curso', 'programado'].includes(t.estado) ? 1 : 0) == S.act).map(tCard)),
  proximos: () => nuevo('partidos', 'Nuevo partido') + grid(byDate(d('partidos').filter((p) => ['programado', 'en_curso'].includes(p.estado))).map(mCard)),
  jugados: () => grid(byDate(d('partidos').filter((p) => p.estado === 'finalizado')).reverse().map(mCard)),
  perfil: () => info(' Mi perfil', S.user ? `<p>${esc(S.user.nombre)} ${esc(S.user.apellido)}</p><p>Correo: ${esc(S.user.email)}</p><p>Teléfono: ${esc(S.user.telefono || '—')}</p><p>Rol: ${esc(S.user.rol?.nombre || '—')}</p><p class=acts><button class=btn data-pf=perfil>Editar perfil</button><button class="btn alt" data-pf=pass>Cambiar contraseña</button></p>` : '<p>Inicia sesión.</p>'),
  config: () => info(' Configuración', `<p class=mut>Preferencias de la aplicación</p><p class=qa><button class=btn data-cfg=side>${document.body.classList.contains('mini') ? 'Expandir' : 'Plegar'} barra lateral</button>${S.user ? '<button class="btn alt" data-pf=perfil>Editar perfil</button><button class="btn alt" data-pf=pass>Cambiar contraseña</button><button class="btn alt" data-out>Cerrar sesión</button>' : ''}${S.live === 0 ? '<button class="btn alt" data-cfg=reset>Restablecer datos de demostración</button>' : ''}</p>`),
  about: () => info(' Sobre nosotros', '<p>CronoFutbol organiza torneos de fútbol: inscripciones, partidos, resultados y estadísticas, todo en un solo lugar.</p>'),
  who: () => info(' Quiénes somos', '<p>Un equipo de desarrolladores apasionados por el fútbol que quiere que cada torneo, grande o barrial, se viva como una final.</p>'),
  guide: () => info(' Cómo usar CronoFutbol', '<p>1. Explora torneos, jugadores y partidos con las pestañas.</p><p>2. Regístrate o inicia sesión arriba a la derecha.</p><p>3. Consulta tus torneos en la barra lateral.</p><p>4. Revisa estadísticas y goleadores.</p>'),
};
const MI = { torneos: ['🏆', 'Consulta e inscríbete en torneos'], equipos: ['🛡️', 'Equipos registrados'], jugadores: ['⚽', 'Busca jugadores y su detalle'], mi: ['👤', 'Tu perfil o tu equipo'], proximos: ['📅', 'Partidos por jugar'], jugados: ['✅', 'Resultados finalizados'], stats: ['📊', 'Goleadores y estadísticas'], usuarios: ['🔑', 'Gestiona usuarios y roles'], activos: ['🟢', 'Torneos activos e inactivos'] };
const menuH = () => `<section class=wel><span class=av>${esc(S.user.nombre.charAt(0).toUpperCase())}</span><div><h3>¡Hola, ${esc(S.user.nombre)}!</h3><p>Rol: <span class=bd>${RN[rk()]}</span> · ¿Qué quieres hacer hoy?</p></div></section><div class=grid>${(TB[rk()] || PUB).filter((k) => k !== 'home' && MI[k]).map((k) => `<article class="card mc" data-t=${k}><b class=mi>${MI[k][0]}</b><div><h3>${lbl(k)}</h3><p class=mut>${MI[k][1]}</p></div><span class=ar>›</span></article>`).join('')}</div><h3 class=sec>Resumen</h3>`;
const heroH = () => `<section class=hero><div><span class=pill>Temporada ${new Date().getFullYear()}</span><h2>Organiza tu torneo.<br>Vive cada partido.</h2><p>Inscripciones, calendario, resultados y estadísticas de tus torneos de fútbol en un solo lugar.</p><div class=qa><button class=btn data-m=register>Crear cuenta gratis</button><button class="btn alt" data-m=login>Iniciar sesión</button></div></div><div class=hball>⚽</div></section>`;
const home0 = V.home;
V.home = () => (S.user ? menuH() : heroH()) + home0();
const TABS = { home: 'Inicio', mi: 'Mi perfil', torneos: 'Torneos', equipos: 'Equipos', jugadores: 'Jugadores', stats: 'Estadísticas de jugador', activos: 'Torneos activos/inactivos', proximos: 'Próximos partidos', jugados: 'Partidos jugados', usuarios: 'Usuarios' };
const PUB = ['home', 'torneos', 'equipos', 'jugadores', 'stats', 'activos', 'proximos', 'jugados'];
const TB = { admin: ['home', 'torneos', 'equipos', 'jugadores', 'proximos', 'jugados', 'stats', 'usuarios'], dt: ['home', 'mi', 'torneos', 'proximos', 'jugados', 'stats'], jug: ['home', 'mi', 'torneos', 'proximos', 'jugados', 'stats'], arb: ['home', 'proximos', 'jugados', 'stats'], afi: PUB, '': PUB };
const lbl = (k) => (k === 'mi' ? (rk() === 'dt' ? 'Mi equipo' : 'Mi perfil') : k === 'home' && S.user ? 'Menú principal' : k === 'proximos' && rk() === 'arb' ? 'Partidos por arbitrar' : TABS[k]);
const RO = (n) => { const i = ROLES0.findIndex((x) => nm(x) === nm(n)); return i < 0 ? 99 : i; };
const rolOn = (r) => nm(est(r.estado) ?? 'activo') === 'activo';
const rolAct = () => S.roles.filter(rolOn).sort((a, b) => RO(a.nombre) - RO(b.nombre) || String(a.nombre).localeCompare(String(b.nombre)));
const nUs = (r) => d('usuarios').filter((u) => u.rol_id == r.id && nm(est(u.estado) ?? 'activo') === 'activo').length;
const rolesH = () => (rolAct().length ? `<div class=ra data-t=usuarios title="Gestionar usuarios y roles"><p class=sh>Roles activos</p>${rolAct().map((r) => `<div class="rar${RO(r.nombre) === 0 ? ' top' : ''}"><span>${esc(r.nombre)}</span><b>${nUs(r)}</b></div>`).join('')}</div>` : '');
const INFO = [['about', 'about', 'Sobre nosotros'], ['who', 'who', 'Quiénes somos'], ['guide', 'guide', 'Cómo usar']];
// Menú lateral: [grupo, [[pestaña, icono, texto], ...]]. Cambia según haya sesión y según el rol.
const sideMenu = () => {
  if (!S.user) return [['Explorar', [['home', 'home', 'Inicio'], ['torneos', 'torneos', 'Torneos'], ['proximos', 'proximos', 'Próximos partidos'], ['jugados', 'jugados', 'Partidos jugados'], ['stats', 'stats', 'Estadísticas']]], ['Tu cuenta', [['login', 'login', 'Iniciar sesión'], ['register', 'register', 'Registrarme']]], ['Información', INFO]];
  const k = rk(), main = (TB[k] || PUB).map((t) => [t, t === 'mi' ? (k === 'dt' ? 'equipos' : 'perfil') : t, lbl(t)]);
  if (k === 'admin' || k === 'dt') main.push(['mine', 'mine', k === 'dt' ? 'Mis torneos' : 'Torneos creados']);
  return [['Principal', main], ['Cuenta', [['perfil', 'perfil', 'Mi cuenta'], ['notif', 'notif', 'Notificaciones'], ['config', 'config', 'Configuración']]], ['Información', INFO]];
};
const sideH = () => (S.user ? `<div class=rolchip data-r=${rk()}>${RN[rk()]}</div>` + (rk() === 'admin' ? rolesH() : '') : '')
  + sideMenu().map(([g, it]) => `<p class=sh>${g}</p>` + it.map(([t, i, l]) => `<button class="${S.tab === t ? 'on' : ''}" data-t=${t} title="${l}">${ico(i)}<span>${l}</span></button>`).join('')).join('')
  + (S.user ? `<p class=sh>Sesión</p><button data-out title="Cerrar sesión">${ico('logout')}<span>Cerrar sesión</span></button>` : '');
const ICO = { home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>', torneos: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3"/>', activos: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/>', equipos: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>', jugadores: '<circle cx="12" cy="7" r="3.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>', perfil: '<circle cx="12" cy="7" r="3.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>', proximos: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', jugados: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>', usuarios: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>', login: '<path d="M14 4h5a1 1 0 011 1v14a1 1 0 01-1 1h-5M10 8l4 4-4 4M14 12H3"/>', register: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/>', notif: '<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 21a2 2 0 004 0"/>', logout: '<path d="M10 4H5a1 1 0 00-1 1v14a1 1 0 001 1h5M16 8l4 4-4 4M20 12H9"/>', stats: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', mine: '<path d="M9 4h6v3H9zM6 5H5a1 1 0 00-1 1v14a1 1 0 001 1h14a1 1 0 001-1V6a1 1 0 00-1-1h-1M8 12h8M8 16h5"/>', config: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>', about: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.5"/>', who: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3 3 0 010 6M22 20c0-3-2-5-4-5.5"/>', guide: '<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19V5M8 8h7"/>' };
const ico = (k) => `<svg class=ic viewBox="0 0 24 24" width=18 height=18 fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>${ICO[k] || ''}</svg>`;

function render() {
  if (S.user && ['login', 'register'].includes(S.tab)) S.tab = 'home';
  if (S.user && TABS[S.tab] && !(TB[rk()] || PUB).includes(S.tab)) S.tab = 'home';
  const au = ['login', 'register'].includes(S.tab);
  $('#tabs').classList.toggle('hide', au); $('#title').classList.toggle('hide', au);
  $('#tabs').innerHTML = (TB[rk()] || PUB).map((k) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-t=${k}>${lbl(k)}</button>`).join('');
  $('#sn').innerHTML = sideH();
  $('#title').textContent = lbl(S.tab) || { notif: 'Notificaciones', mine: ' Torneos creados', perfil: ' Perfil', config: ' Configuración', about: ' Sobre nosotros', who: ' Quiénes somos', guide: ' Guía rápida' }[S.tab];
  $('#view').innerHTML = V[S.tab]();
}
function renderUser() {
  const u = S.user;
  $('#user').innerHTML = u
    ? `<button id=ub class=ubtn><span class=av>${esc(u.nombre.charAt(0).toUpperCase())}</span>${esc(u.nombre)} <small class=rb>${RN[rk()]}</small> ▾</button><div id=um class="um hide"><button data-t=perfil>Perfil</button><button data-t=config>Configuración</button><button data-t=notif>Notificaciones</button><p>Rol: <span class=bd>${RN[rk()]}</span></p>${isAdmin() ? `<label>Cambiar de rol (vista)<select id=as class=sel><option value="">Administrador</option>${['Director técnico', 'Jugador', 'Árbitro', 'Aficionado'].map((n) => `<option ${S.as === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>` : ''}<button data-out>Cerrar sesión</button></div>`
    : '<button class=btn data-m=login>Iniciar sesión</button><button class="btn alt" data-m=register>Registrarse</button>';
}
const ui = () => { renderUser(); render(); };

// ====== Eventos ======
document.addEventListener('click', async (e) => {
  const cv = e.target.closest('[data-v]');
  if (cv && !e.target.closest('button,a,input,select')) { e.preventDefault(); const [en, id] = cv.dataset.v.split(':'); openDetail(en, id); return; }
  const t = e.target.closest('[data-t],[data-m],[data-x],[data-xd],[data-out],[data-a],[data-e],[data-del],[data-i],[data-p],[data-mkroles],[data-eye],[data-pf],[data-cfg],#burger,#ub');
  if (!t) { if (!e.target.closest('#um')) $('#um')?.classList.add('hide'); return; }
  e.preventDefault();
  if (t.dataset.t) { S.tab = t.dataset.t; scrollTo(0, 0); if (S.tab === 'notif' && S.user) { try { S.d.notificaciones = (await api('/notificaciones')).filter((n) => n.usuario_id == S.user.id); } catch {} } $('#um')?.classList.add('hide'); document.body.classList.remove('open'); render(); }
  else if (t.dataset.m) { S.tab = t.dataset.m; render(); }
  else if (t.dataset.e) { const [en, id] = t.dataset.e.split(':'); $('#dd').close(); openForm(en, id); }
  else if (t.dataset.i) {
    const tid = +t.dataset.i;
    if (rk() === 'admin') { $('#dd').close(); openForm('inscripciones', 'new', { torneo_id: tid, fecha_inscripcion: hoy, estado: 'activa' }); }
    else { try { await api('/inscripciones', { method: 'POST', body: { torneo_id: tid, equipo_id: miEq().id, fecha_inscripcion: hoy, estado: 'activa' } }); await reload(); render(); if ($('#dd').open) openDetail('torneos', tid); toast('Equipo inscrito en el torneo'); } catch (x) { toast(Object.values(x.errors || {})[0]?.[0] || x.message || 'No se pudo inscribir'); } }
  }
  else if (t.dataset.pf) openPerfil(t.dataset.pf);
  else if (t.dataset.cfg === 'side') { document.body.classList.toggle(innerWidth < 800 ? 'open' : 'mini'); render(); }
  else if (t.dataset.cfg === 'reset') { if (arm(t)) { LS.removeItem('mockdb'); logout(true); location.reload(); } }
  else if (t.dataset.eye !== undefined) { const i = t.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; }
  else if (t.dataset.p) { $('#dd').close(); openForm('partidos', 'new', { torneo_id: +t.dataset.p }); }
  else if (t.dataset.mkroles !== undefined) { for (const n of ROLES0) if (!S.roles.some((r) => nm(r.nombre) === nm(n))) { try { await api('/roles', { method: 'POST', body: { nombre: n, descripcion: n, estado: 'activo' } }); } catch {} } await loadAdmin(); render(); toast('Roles creados'); }
  else if (t.dataset.del) { const [en, id] = t.dataset.del.split(':'); if (arm(t)) { try { const rr = en === 'inscripciones' ? d(en).find((x) => x.id == id) : null; await api('/' + en + '/' + id, { method: 'DELETE' }); $('#dd').close(); await reload(); render(); if (rr) openDetail('torneos', rr.torneo_id); toast('Eliminado'); } catch (x) { toast(x.message || 'No se pudo eliminar'); } } }
  else if (t.dataset.x !== undefined) $('#dlg').close();
  else if (t.dataset.xd !== undefined) $('#dd').close();
  else if (t.dataset.a) { S.act = +t.dataset.a; render(); }
  else if (t.dataset.out !== undefined) logout();
  else if (t.id === 'burger') document.body.classList.toggle(innerWidth < 800 ? 'open' : 'mini');
  else if (t.id === 'ub') {
    if (!S.roles.length) { try { S.roles = await api('/roles'); renderUser(); } catch {} }
    $('#um').classList.toggle('hide');
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; $('#gj').innerHTML = jCards(); } });
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.id === 'as') { S.as = el.value || null; S.tab = 'home'; ui(); }
  else if (el.dataset.ur) {
    const u = d('usuarios').find((x) => x.id == el.dataset.ur);
    try { await api('/usuarios/' + u.id, { method: 'PUT', body: { rol_id: +el.value, nombre: u.nombre, apellido: u.apellido, email: u.email, telefono: u.telefono, estado: u.estado } }); await loadAdmin(); render(); toast('Rol actualizado'); }
    catch (x) { toast(Object.values(x.errors || {})[0]?.[0] || x.message || 'No se pudo cambiar el rol'); }
  }
});

// ====== Detección automática de la dirección de la API ======
async function findApi() {
  const dir = location.href.split(/[?#]/)[0].replace(/[^/]*$/, '');
  const c = [...new Set([window.CRONO_API, dir + 'api', location.origin + '/api', 'http://127.0.0.1:8000/api', 'http://localhost:8000/api'].filter((u) => u && /^https?:/.test(u)))];
  for (const u of c) { try { const r = await fetch(u + '/torneos', { headers: { Accept: 'application/json' } }); if (r.ok && (r.headers.get('content-type') || '').includes('json')) return u; } catch {} }
  return null;
}
// ====== Arranque ======
$('#ct').innerHTML = CONTACTOS.map(([n, u, c, d]) => `<a href="${u}" target=_blank rel=noopener title="${n}"><b class=ci style="background:${c}"><svg viewBox="0 0 24 24" width=16 height=16 fill=#fff><path d="${d}"/></svg></b><span>${n}</span></a>`).join('');
$('#toast').classList.add('hide');
(async () => {
  ui(); $('#view').innerHTML = '<p class=empty><span class=spin></span> Cargando…</p>';
  const k = ['torneos', 'equipos', 'jugadores', 'partidos', 'estadisticas-jugadores', 'inscripciones'];
  const found = await findApi(); if (found) API = found;
  const rs = await Promise.allSettled(k.map((x) => api('/' + x)));
  rs.forEach((r, i) => (S.d[k[i]] = r.status === 'fulfilled' ? r.value : []));
  if (rs.every((r) => r.status === 'rejected' && (r.reason?.net || r.reason?.status === 404))) { S.live = 0; await reload(); }
  else S.live = 1;
  if (S.token) api('/auth/me').then(async (u) => { S.user = u; save(); await loadAdmin(); ui(); }).catch(() => {});
  render();
})();

</script>
